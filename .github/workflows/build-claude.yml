name: Build Claude clones

# Separate from build.yml/build-x.yml on purpose: the Claude build has its own
# split-bundle download (apkcombo/uptodown), its own patch bundle
# (vantage-patches), and publishes its own "claude-v..." release. A failure
# here never blocks the YouTube nightly or the X build.

on:
  schedule:
    # Daily, offset from both the YouTube and X builds. build-claude.sh skips
    # early (exit 0) when neither the Claude app version nor vantage-patches
    # changed, so most ticks are cheap no-ops.
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a build even if the Claude version/vantage-patches are unchanged"
        type: boolean
        default: false

concurrency:
  group: vantage-build-claude
  cancel-in-progress: false

permissions:
  contents: write        # create the Claude release + read/write the stock-cache

jobs:
  build-claude:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # ~50MB split-bundle download + a merge + 3 patch passes, with headroom
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VANTAGE_KEYSTORE_B64: ${{ secrets.VANTAGE_KEYSTORE_B64 }}
      VANTAGE_KEYSTORE_PASS: ${{ secrets.VANTAGE_KEYSTORE_PASS }}
      VANTAGE_KEYSTORE_ALIAS: ${{ secrets.VANTAGE_KEYSTORE_ALIAS }}
      VANTAGE_KEYSTORE_SHA256: ${{ secrets.VANTAGE_KEYSTORE_SHA256 }}
      VANTAGE_CERT_SHA256: ${{ secrets.VANTAGE_CERT_SHA256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Show toolchain
        run: |
          java -version
          ls "$ANDROID_HOME/build-tools" 2>/dev/null | tail -3 || true
          jq --version

      - name: Install curl_cffi (apkcombo/uptodown download)
        run: |
          python3 -m pip install --quiet --user curl_cffi \
            || python3 -m pip install --quiet --break-system-packages curl_cffi \
            || python3 -m pip install --quiet curl_cffi
          python3 -c "import curl_cffi; print('curl_cffi', curl_cffi.__version__)"

      - name: Build Claude clones (resolve, skip-if-unchanged, download+merge, patch, assert, release)
        run: |
          set -euo pipefail
          FORCE=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE="--force"; fi
          bash scripts/build-claude.sh $FORCE --release

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vantage-claude-build-logs
          path: |
            build/out/claude-*.log
            build/out/claude-*-result.json
          if-no-files-found: ignore
          retention-days: 14
